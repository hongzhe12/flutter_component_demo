name: Build Flutter Release APK

on:
  push:
    branches: [todo]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.x"
          channel: stable

      - name: Decode keystore
        run: |
          # 直接硬编码 Base64 字符串
          echo "" | base64 --decode > android/upload-keystore.jks

          # 直接硬编码密码和别名
          echo "storePassword=123456" > android/key.properties
          echo "keyPassword=123456" >> android/key.properties
          echo "keyAlias=my-key-alias" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_id }}
          name: APK Build #${{ github.run_number }}
          body: |
            Auto-generated release from workflow run #${{ github.run_number }}.
            Branch: ${{ github.ref_name }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true

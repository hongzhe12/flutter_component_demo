name: Build Flutter Multi-Platform Release

on:
  push:
    branches: [todo]
  workflow_dispatch:
    inputs:
      build_ios:
        description: "Build iOS package (no code signing)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build_android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.x"
          channel: stable

      - name: Decode keystore
        run: |
          # 直接硬编码 Base64 字符串
          echo "" | base64 --decode > android/upload-keystore.jks

          # 直接硬编码密码和别名
          echo "storePassword=123456" > android/key.properties
          echo "keyPassword=123456" >> android/key.properties
          echo "keyAlias=my-key-alias" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Build release APK
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build_windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.x"
          channel: stable

      - name: Build Windows release
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          dart run flutter_launcher_icons
          flutter build windows --release
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "flutter_component_demo-windows.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: flutter_component_demo-windows.zip

  build_macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.x"
          channel: stable

      - name: Build macOS release
        shell: bash
        run: |
          flutter config --enable-macos-desktop
          flutter pub get
          dart run flutter_launcher_icons
          flutter build macos --release
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app package found under build/macos/Build/Products/Release"
            exit 1
          fi
          APP_NAME=$(basename "$APP_PATH")
          ZIP_NAME="${APP_NAME%.app}-macos.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_NAME"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: "*-macos.zip"

  build_ios:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ios }}
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.x"
          channel: stable

      - name: Build iOS release (no code signing)
        shell: bash
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter build ios --release --no-codesign
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "No iOS .app package found at $APP_PATH"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "Runner-ios.zip"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-zip
          path: Runner-ios.zip

  release:
    needs: [build_android, build_windows, build_macos, build_ios]
    if: ${{ always() && needs.build_android.result == 'success' && needs.build_windows.result == 'success' && needs.build_macos.result == 'success' && (needs.build_ios.result == 'success' || needs.build_ios.result == 'skipped') }}
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show artifacts
        run: ls -lah dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: Multi-Platform Build #${{ github.run_number }}
          body: |
            Auto-generated multi-platform release from workflow run #${{ github.run_number }}.
            Branch: ${{ github.ref_name }}
            Includes: Android APK, Windows ZIP, macOS ZIP, iOS ZIP (if enabled)
          files: |
            dist/*
          generate_release_notes: true
